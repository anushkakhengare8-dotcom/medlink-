<svg width="560" height="480" viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract marketplace illustration: stacked "stock" cards connecting
       to a "storefront" card, plus a small analytics squiggle and a
       verified-order badge. Flat shapes only, no photography needed. -->

  <!-- soft background blob -->
  <ellipse cx="290" cy="250" rx="250" ry="220" fill="#EFF4FE"/>

  <!-- distributor stock cards (left cluster) -->
  <rect x="40" y="120" width="150" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="60" y="145" width="70" height="10" rx="5" fill="#1E3A8A"/>
  <rect x="60" y="165" width="100" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="60" y="180" width="80" height="8" rx="4" fill="#E2E8F0"/>

  <rect x="70" y="230" width="150" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="90" y="255" width="70" height="10" rx="5" fill="#F97316"/>
  <rect x="90" y="275" width="100" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="90" y="290" width="80" height="8" rx="4" fill="#E2E8F0"/>

  <!-- connecting line from stock cards to storefront -->
  <path d="M220 235 C 280 200, 300 200, 350 210" stroke="#2563EB" stroke-width="3" fill="none" stroke-dasharray="6 8"/>

  <!-- pharmacy storefront card (right) -->
  <rect x="340" y="150" width="180" height="200" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="365" y="180" width="130" height="14" rx="7" fill="#1E293B"/>
  <rect x="365" y="205" width="90" height="10" rx="5" fill="#64748B"/>

  <!-- little order rows inside storefront card -->
  <rect x="365" y="235" width="130" height="34" rx="10" fill="#F8FAFC"/>
  <circle cx="382" cy="252" r="6" fill="#2563EB"/>
  <rect x="398" y="247" width="70" height="10" rx="5" fill="#1E293B"/>

  <rect x="365" y="278" width="130" height="34" rx="10" fill="#F8FAFC"/>
  <circle cx="382" cy="295" r="6" fill="#F97316"/>
  <rect x="398" y="290" width="70" height="10" rx="5" fill="#1E293B"/>

  <!-- verified badge -->
  <circle cx="500" cy="150" r="26" fill="#FBBF24"/>
  <path d="M488 150 l8 8 l16 -18" stroke="#1E293B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- analytics squiggle bottom left -->
  <path d="M40 400 L 90 380 L 130 410 L 180 360 L 230 390" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="390" r="6" fill="#2563EB"/>
</svg>
