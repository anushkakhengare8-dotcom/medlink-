<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>MedLink — Notifications</title>
<script>
  if (localStorage.getItem('medlink-theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body data-page="notifications">

<div class="site-shell">
  <div class="sidebar__backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">

      <div class="page-header">
        <h1>Notifications</h1>
        <p>Order updates, stock alerts, and account activity land here.</p>
      </div>

      <div class="card">
        <div class="table-wrap" id="notificationsList" style="display:none;"></div>
        <div class="empty-state" id="notificationsEmptyState">
          <div class="empty-state__icon"><i class="ti ti-bell-off"></i></div>
          <h3>You're all caught up</h3>
          <p>No notifications yet. Order status changes and stock alerts will appear here once you're active.</p>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
